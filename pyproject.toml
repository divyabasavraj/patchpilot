[project]
name = "cve-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Divya Basavraj", email = "divyabasavraj54@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "cvss>=3.6",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "packaging>=26.3",
]

[project.scripts]
cve-copilot = "cve_copilot:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
